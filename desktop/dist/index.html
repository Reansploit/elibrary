<!doctype html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>E-Library</title>
  <style>
    body { font-family: system-ui, sans-serif; display: grid; place-items: center;
      height: 100vh; margin: 0; background: #F9F8F6; color: #1C1917; }
    .box { text-align: center; width: min(92vw, 340px); }
    input, button { width: 100%; padding: 10px 12px; font-size: 14px;
      border-radius: 8px; box-sizing: border-box; }
    input { border: 1px solid #EDE4D8; margin: 12px 0 8px; }
    button { border: 0; background: #EA580C; color: #fff; cursor: pointer; }
    .link { background: none; color: #78716C; margin-top: 8px; }
    .update { margin-top: 12px; border: 1px solid #FDBA74; background: #FFF7ED;
      border-radius: 8px; padding: 10px 12px; font-size: 13px; color: #9A3412; }
    .update button { margin-top: 8px; }
    .ver { margin-top: 12px; font-size: 11px; color: #A8A29E; }
  </style>
</head>
<body>
  <div class="box" id="setup">
    <h2 style="margin:0">E-Library</h2>
    <p style="color:#78716C;font-size:13px">Masukkan alamat server perpustakaan</p>
    <input id="url" placeholder="http://192.168.2.51:3002" />
    <button onclick="save()">Hubungkan</button>
    <p class="ver" id="ver-setup"></p>
  </div>
  <div class="box" id="go" style="display:none">
    <h2 style="margin:0">E-Library</h2>
    <p style="color:#78716C;font-size:13px" id="target"></p>
    <button onclick="connect()">Buka aplikasi</button>
    <button class="link" onclick="reset()">Ganti server</button>
    <div class="update" id="update" style="display:none">
      <span id="update-text"></span>
      <button id="update-btn" style="display:none">Download update</button>
    </div>
    <p class="ver" id="ver-go"></p>
  </div>
  <script>
    // NAIKKAN tiap rilis wrapper baru (samakan dengan tauri.conf.json + Cargo.toml).
    const WRAPPER_VERSION = '0.1.0';

    document.getElementById('ver-setup').textContent = 'v' + WRAPPER_VERSION;
    document.getElementById('ver-go').textContent = 'v' + WRAPPER_VERSION;

    const saved = localStorage.getItem('server_url');
    if (saved) {
      showGo(saved);
    }

    function showGo(url) {
      document.getElementById('setup').style.display = 'none';
      document.getElementById('go').style.display = 'block';
      document.getElementById('target').textContent = url;
      checkUpdate(url);
    }

    function save() {
      let u = document.getElementById('url').value.trim().replace(/\/+$/, '');
      if (!/^https?:\/\//i.test(u)) u = 'http://' + u;
      localStorage.setItem('server_url', u);
      location.href = u;
    }
    function connect() { location.href = localStorage.getItem('server_url'); }
    function reset() {
      localStorage.removeItem('server_url');
      document.getElementById('update').style.display = 'none';
      document.getElementById('go').style.display = 'none';
      document.getElementById('setup').style.display = 'block';
    }

    function isNewer(remote, local) {
      const a = String(remote || '').split('.').map(Number);
      const b = String(local || '').split('.').map(Number);
      for (let i = 0; i < Math.max(a.length, b.length); i++) {
        const x = a[i] || 0, y = b[i] || 0;
        if (x !== y) return x > y;
      }
      return false;
    }

    async function checkUpdate(server) {
      try {
        const res = await fetch(server.replace(/\/+$/, '') + '/wrapper-version.json', {
          headers: { Accept: 'application/json' },
        });
        if (!res.ok) return;
        const info = await res.json();
        if (!isNewer(info.version, WRAPPER_VERSION)) return;
        document.getElementById('update-text').textContent =
          'Update v' + info.version + ' tersedia.' + (info.notes ? ' ' + info.notes : '');
        const btn = document.getElementById('update-btn');
        if (info.download_url) {
          btn.style.display = 'block';
          btn.onclick = () => { location.href = info.download_url; };
        }
        document.getElementById('update').style.display = 'block';
      } catch {
        // Server lama/offline: diam saja, app tetap bisa dibuka.
      }
    }
  </script>
</body>
</html>
