[package]
name = "elibrary-desktop"
version = "0.3.4"
edition = "2021"

[[bin]]
name = "WBSHelper"
path = "src/bin/agent.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-global-shortcut = { version = "2" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
