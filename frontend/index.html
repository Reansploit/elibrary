<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="./logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Perpustakaan Wonosalam — Sistem Informasi Perpustakaan</title>
    <!-- Cegah kedip tema: set .dark sepagi mungkin sesuai simpanan/sistem -->
    <script>
      try {
        var s = JSON.parse(localStorage.getItem('elib_theme') || '{}');
        var m = (s.state && s.state.mode) || 'system';
        if (m === 'dark' || (m === 'system' && matchMedia('(prefers-color-scheme: dark)').matches)) {
          document.documentElement.classList.add('dark');
        }
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
