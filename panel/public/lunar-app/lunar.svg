<svg viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <!-- flat background -->
    <style>
      .band1{fill:#2C1650;}
      .band2{fill:#442080;}
      .band3{fill:#5B2FA3;}
      .band4{fill:#7C4FCB;}
      .band5{fill:#A87FE0;}
      .band6{fill:#C9AEF2;}
      .band7{fill:#E8D7FF;}
      .highlight{fill:#FFFFFF;}
    </style>
  </defs>

  <!-- rounded square badge -->
  <rect x="0" y="0" width="512" height="512" rx="112" fill="#F8F5FF"/>

  <!-- crescent moon built from concentric flat bands, like sliced onion layers -->
  <g>
    <mask id="crescentMask">
      <rect x="0" y="0" width="512" height="512" fill="black"/>
      <circle cx="256" cy="256" r="176" fill="white"/>
      <circle cx="322" cy="196" r="150" fill="black"/>
    </mask>

    <g mask="url(#crescentMask)">
      <circle cx="256" cy="256" r="176" class="band1"/>
      <circle cx="256" cy="256" r="151" class="band2"/>
      <circle cx="256" cy="256" r="126" class="band3"/>
      <circle cx="256" cy="256" r="101" class="band4"/>
      <circle cx="256" cy="256" r="76"  class="band5"/>
      <circle cx="256" cy="256" r="51"  class="band6"/>
      <circle cx="256" cy="256" r="26"  class="band7"/>
    </g>

    <!-- crisp outline -->
    <g mask="url(#crescentMask)">
      <circle cx="256" cy="256" r="176" fill="none" stroke="#2C1650" stroke-width="3" opacity="0.15"/>
    </g>
  </g>

  <!-- small highlight dot, echoes tor's top-left light source -->
  <circle cx="150" cy="150" r="10" class="highlight" opacity="0.9"/>
</svg>
